<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek APK Builder</title>
    <style>
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .chat-window {
            width: 900px;
            max-width: 100%;
            height: 80vh;
            background: #1e1e1e;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .chat-header {
            background: #2d2d2d;
            padding: 15px 20px;
            border-bottom: 1px solid #444;
            font-weight: bold;
            color: #10a37f;
            font-size: 1.1em;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #121212;
        }
        .message {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 18px;
            line-height: 1.4;
            font-size: 14px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user-message {
            background: #10a37f;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .agent-message {
            background: #2d2d2d;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            font-family: monospace;
        }
        .input-area {
            padding: 15px;
            background: #1e1e1e;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 24px;
            padding: 12px 18px;
            color: white;
            font-family: inherit;
            resize: none;
            outline: none;
            font-size: 14px;
        }
        button {
            background: #10a37f;
            border: none;
            border-radius: 24px;
            padding: 0 24px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0e8b6c;
        }
        .status {
            padding: 8px 15px;
            background: #0a0a0a;
            border-top: 1px solid #333;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="chat-window">
        <div class="chat-header">
            🤖 DeepSeek APK Builder — v4 Pro (max reasoning)
        </div>
        <div class="messages" id="messages">
            <div class="message agent-message">✅ Agent ready. I can read/write files, run commands, and build Android projects.<br><br>Give me a task like:<br>📱 "Generate a full Android Kotlin project with a simple 'Hello World' app and compile an APK."</div>
        </div>
        <div class="input-area">
            <textarea id="userInput" placeholder="Ask me to build an APK..."></textarea>
            <button id="sendBtn">Send</button>
        </div>
        <div class="status" id="status">● Ready</div>
    </div>

    <script>
        // ----------------------------------------------------------------------
        // CONFIGURATION
        // ----------------------------------------------------------------------
        // Your Render backend URL (IMPORTANT: change this to your actual service URL)
        const API_URL = 'https://awesome-deepseek-agent-1.onrender.com/chat';
        
        // If you set API_SECRET_KEY on Render, put it here:
        const API_SECRET = '';   // e.g., "your-secret-key"
        
        // Session persistence (optional)
        let sessionId = localStorage.getItem('agentSessionId');
        if (!sessionId) {
            sessionId = crypto.randomUUID();
            localStorage.setItem('agentSessionId', sessionId);
        }
        
        // ----------------------------------------------------------------------
        // DOM elements
        // ----------------------------------------------------------------------
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusSpan = document.getElementById('status');
        
        // Helper: add a message bubble
        function addMessage(text, isUser = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'agent-message'}`;
            msgDiv.textContent = text;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        // Helper: update status bar
        function setStatus(msg, isError = false) {
            statusSpan.innerHTML = isError ? `⚠️ ${msg}` : `● ${msg}`;
        }
        
        // Send a message to the backend
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            
            // Clear input and show user message
            userInput.value = '';
            addMessage(text, true);
            setStatus('Agent is thinking...');
            
            // Prepare request headers
            const headers = { 'Content-Type': 'application/json' };
            if (API_SECRET) headers['Authorization'] = `Bearer ${API_SECRET}`;
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        message: text,
                        sessionId: sessionId
                    })
                });
                
                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errText}`);
                }
                
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                
                addMessage(data.reply, false);
                setStatus('Ready');
            } catch (err) {
                console.error(err);
                addMessage(`⚠️ Error: ${err.message}`, false);
                setStatus('Error — check console', true);
            }
        }
        
        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Optional: focus on input on page load
        userInput.focus();
    </script>
</body>
</html>
